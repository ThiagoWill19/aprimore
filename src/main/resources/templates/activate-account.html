<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aprimore | Criar senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container mt-5">
        <section class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm"><div class="card-body p-4">
                    <h1 class="h3 text-center mb-3">Crie sua senha</h1>
                    <p class="text-muted text-center">Defina a senha que sera usada para acessar a plataforma.</p>
                    <div th:if="${invalidToken}" class="alert alert-danger">Este link e invalido, expirou ou ja foi utilizado.</div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:unless="${invalidToken}" th:action="@{/activate-account}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="mb-3"><label for="password" class="form-label">Senha</label>
                            <input id="password" name="password" type="password" class="form-control" minlength="8" required autofocus>
                            <div class="form-text">Minimo de 8 caracteres e 1 caractere especial.</div></div>
                        <div class="mb-3"><label for="confirmPassword" class="form-label">Confirmar senha</label>
                            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" minlength="8" required></div>
                        <button type="submit" class="btn btn-primary w-100">Criar senha e acessar</button>
                    </form>
                    <a th:if="${invalidToken}" class="btn btn-outline-secondary w-100" th:href="@{/login}">Voltar ao login</a>
                </div></div>
            </div>
        </section>
    </main>
</body>
</html>
