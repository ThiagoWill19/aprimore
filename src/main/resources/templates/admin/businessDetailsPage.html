<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | Admin Page</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
	  <div class="container-fluid">
	    <a class="navbar-brand" href="/admin">Aprimore - ADM</a>
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>
	    <div class="collapse navbar-collapse" id="navbarSupportedContent">
	      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
	        <li class="nav-item">
	          <a class="nav-link active" aria-current="page" href="/admin">Home</a>
	        </li>
	        <li class="nav-item">
	          <a class="nav-link" href="#">Configurações</a>
	        </li>
	        <li class="nav-item dropdown">
	          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
	            Clientes
	          </a>
	          <ul class="dropdown-menu">
	            <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#newBusinessModal">Cadastrar nova empresa</a></li>
	            <li><a class="dropdown-item" href="/admin/business-list">Ver clientes</a></li>
	            <li><hr class="dropdown-divider"></li>
	            <li><a class="dropdown-item" href="#">Relatório detalhado</a></li>
	          </ul>
	        </li>
	      </ul>
	    </div>
	  </div>
	</nav>
	
	<main class="container">
		
		<div th:if="${erro}" class="alert alert-danger">
		    <span th:text="${erro}"></span>
		</div>
		
		<h1 class="mt-5">Empresa</h1>
		<div class="row">
			
			<div class="mt-3 col-12 col-md-4">
				<label for="name">Razão Social</label>
				<input class="form-control" id="name" th:value="${business.name}" disabled></input>
			</div>
			
			<div class="mt-3 col-12 col-md-4">
				<label for="tradeName">Nome Fantasia</label>
				<input class="form-control" id="tradeName" th:value="${business.tradeName}" disabled></input>
			</div>
			
			<div class="mt-3 col-12 col-md-4">
				<label for="cnpj">CNPJ</label>
				<input class="form-control" id="cnpj" th:value="${business.cnpj}" disabled></input>
			</div>	

		</div>
		
		<div class="row">
			
			<div class="mt-3 col-12 col-md-4">
				<label for="createdAt">Data do cadastro</label>
				<input class="form-control" id="createdAt" th:value="${#temporals.format(business.createdAt,'dd/MM/yyy')}" disabled></input>
			</div>	

			<div class="mt-3 col-12 col-md-4">
				<label for="accountStatus">Status da conta</label>
				<input class="form-control" th:classappend="${business.accountStatus.name() == 'INACTIVE'} ? 'text-danger' : 'text-success'"
				id="AccountStatus" th:value="${business.accountStatus.name() == 'INACTIVE'} ? 'Desativada' : 'Ativa'" disabled></input>
			</div>
					
		</div>
		
		<div class="row">
			
			<div class="mt-3 col-12 col-md-4">
				<label for="phone">Telefone</label>
				<input class="form-control" id="phone" th:value="${business.phone}" disabled></input>
			</div>
			
			<div class="mt-3 col-12 col-md-4">
				<label for="businessEmail">Email</label>
				<input class="form-control" id="bisinessEmail" th:value="${business.businessEmail}" disabled></input>
			</div>

		</div>
		
		<div class="row">
			
			<div class="mt-3 col-12 col-md-4">
				<label for="quantityUser">Quantidade de contas de acesso cadastradas</label>
				<input class="form-control" id="quantityUser" th:value="${business.quantityUser}" disabled></input>
				<a href="#">Ver usuários cadastrados</a>
			</div>	
			
			<div class="mt-3 col-12 col-md-4">
				<label for="quantityClients">Quantidade de Clientes cadastrados</label>
				<input class="form-control" id="quantityClients" th:value="${business.quantityClients}" disabled></input>
				<a href="#">Ver clientes cadastrados</a>
			</div>

		</div>
		
		<div class="row mt-5 mb-5">
			<div class="col-12 d-flex">
				<a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editBusinessModal">Editar informações</a>
				<form class="mx-5" method="post" th:action="@{/admin/business/accountStatus}">
				    <input type="hidden" name="id" th:value="${business.id}">
				    
				    <button type="submit"
				        th:class="${business.accountStatus.name() == 'INACTIVE'} 
				                  ? 'btn btn-success' 
				                  : 'btn btn-warning'">
				        <span th:text="${business.accountStatus.name() == 'INACTIVE'} 
				                        ? 'Ativar empresa' 
				                        : 'Desativar empresa'"></span>
				    </button>
				</form>

			</div>
		</div>
			
		
	</main>
	
	
	<!-- Modal de cadastro de empresa -->
	<div class="modal fade" id="newBusinessModal" tabindex="-1" aria-labelledby="newBusinessModalLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h1 class="modal-title fs-5" id="newBusinessModalLabel">Cadastrar empresa</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body">
			
			<form method="post" th:action="@{/admin/create-new-business}">
				<div class="mb-3">
					<label for="inputBusinessName" class="form-label">Razão social</label>
					<input type="text" class="form-control" id="inputBusinessName" th:name="businessName" required>
				</div>
				<div class="mb-3">
					<label for="inputTradeName" class="form-label">Nome fantasia</label>
					<input type="text" class="form-control" id="inputTradeName" th:name="tradeName" required>
				</div>
				<div class="mb-3">
					<label for="inputCnpj" class="form-label">CNPJ</label>
					<input type="text" class="form-control" id="inputCnpj" th:name="cnpj" required>
				</div>
				<div class="mb-3">
					<label for="inputEmailBusiness" class="form-label">Email da empresa</label>
					<input type="email" class="form-control" id="inputEmailBusiness" aria-describedby="emailHelp" th:name="businessEmail" required>
				</div>
				<div class="mb-3">
					<label for="inputPhone" class="form-label">Telefone</label>
					<input type="text" class="form-control" id="inputPhone" th:name="phone" required>
				</div>
					
							
				<div class="mb-3">
					<label for="inputUserName" class="form-label">Nome do usuário</label>
					<input type="text" class="form-control" id="inputUserName" th:name="username" required>
				</div>								
				<div class="mb-3">
					<label for="inputEmail" class="form-label">Email do usuário</label>
					<input type="email" class="form-control" id="inputEmail" aria-describedby="emailHelp" th:name="email" required>
				</div>
				<button type="submit" class="btn btn-success mt-3">Cadastrar</button>
			</form>
	      </div>
	    </div>
	  </div>
	</div>
	
	
	
	<!-- Modal de edição -->
	<div class="modal fade" id="editBusinessModal" tabindex="-1" aria-labelledby="editBusinessModalLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h1 class="modal-title fs-5" id="editBusinessModalLabel">Editar dados da empresa</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body">
			
			<form method="post" th:action="@{/admin/business/update}" th:object="${business}">
				<div class="mb-3">
					<input type="hidden" th:name="id" th:value="${business.id}">
					<label for="inputBusinessName" class="form-label">Razão social</label>
					<input type="text" class="form-control" id="inputBusinessName" th:field="*{name}" required>
				</div>
				<div class="mb-3">
					<label for="inputTradeName" class="form-label">Nome fantasia</label>
					<input type="text" class="form-control" id="inputTradeName" th:field="*{tradeName}" required>
				</div>
				<div class="mb-3">
					<label for="inputCnpj" class="form-label">CNPJ</label>
					<input type="text" class="form-control" id="inputCnpj" th:field="*{cnpj}" required>
				</div>
				<div class="mb-3">
					<label for="inputEmailBusiness" class="form-label">Email da empresa</label>
					<input type="email" class="form-control" id="inputEmailBusiness" aria-describedby="emailHelp" th:field="*{businessEmail}" required>
				</div>
				<div class="mb-3">
					<label for="inputPhone" class="form-label">Telefone</label>
					<input type="text" class="form-control" id="inputPhone" th:field="*{phone}" required>
				</div>
					
				<button type="submit" class="btn btn-success mt-3">Salvar</button>
			</form>
	      </div>
	    </div>
	  </div>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

</body>

</html>
