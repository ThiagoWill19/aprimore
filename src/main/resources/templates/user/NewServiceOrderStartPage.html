<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | Nova Ordem de Serviço</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore</a>
		</div>
	</nav>

	<main class="container">
		<nav aria-label="breadcrumb" class="mt-4">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/user}">Home</a></li>
				<li class="breadcrumb-item active" aria-current="page">Nova OS</li>
			</ol>
		</nav>

		<div th:if="${erro}" class="alert alert-danger">
			<span th:text="${erro}"></span>
		</div>

		<h2 class="mt-3">Nova Ordem de Serviço</h2>
		<p class="text-muted mb-4">Escolha o cliente para iniciar o cadastro da ordem de serviço.</p>

		<div class="row">
			<div class="col-12 col-md-7 card p-3 mb-5">
				<form method="post"
				      th:action="@{/user/service-orders/new/select-client}"
				      th:object="${selection}">

					<div class="mb-3">
						<label class="form-label fw-bold">Cliente</label>
						<select class="form-select" th:field="*{clientId}" required>
							<option value="">Selecione um cliente</option>
							<option th:each="client : ${clients}"
							        th:value="${client.id}"
							        th:text="${client.clientName + (client.active ? '' : ' (inativo)')}">
							</option>
						</select>
						<div class="text-danger" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></div>
					</div>

					<div class="d-flex gap-3">
						<button type="submit" class="btn btn-success">Continuar</button>
						<a class="btn btn-outline-secondary" th:href="@{/user}">Cancelar</a>
					</div>
				</form>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
		crossorigin="anonymous"></script>
</body>

</html>
