<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | User Page</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">


</head>

<body>
	
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
			        data-bs-target="#navbarSupportedContent">
				<span class="navbar-toggler-icon"></span>
			</button>
		</div>
	</nav>

	<main class="container">
		
		<nav aria-label="breadcrumb" class="mt-4">
				<ol class="breadcrumb">
					<li class="breadcrumb-item">
						<a th:href="@{/user}">Home</a>
					</li>
					<li class="breadcrumb-item">
						<a th:href="@{/user/client}">Clientes</a>
					</li>
					<li class="breadcrumb-item active" aria-current="page">
						Cliente
					</li>
				</ol>
			</nav>


		<div th:if="${erro}" class="alert alert-danger">
			<span th:text="${erro}"></span>
		</div>


		<h2 class="mt-3">Empresa</h2>

		<div class="row">

			<div class="col-12 col-md-6 card p-3 mb-5">

				<form method="post" id="clientForm" th:action="@{/user/client/clientUpdate}" th:object="${client}">

					<input type="hidden" th:name="id" th:value="${client.id}">

					<div class="mb-3">
						<label for="inputClientName" class="form-label fw-bold">Nome</label>
						<input type="text" class="form-control" id="inputClientName" th:field="*{clientName}" required
							disabled>
						<div class="text-danger" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}">
						</div>
					</div>
					<div class="mb-3">
						<label for="inputCnpj" class="form-label fw-bold">CNPJ</label>
						<input type="text" class="form-control" id="inputCnpj" th:field="*{cnpj}" required disabled>
						<div class="text-danger" th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}">
						</div>
					</div>
					<div class="mb-3">
						<label for="inputClientEmail" class="form-label fw-bold">Email</label>
						<input type="email" class="form-control" id="inputClientEmail" th:field="*{clientEmail}"
							required disabled>
						<div class="text-danger" th:if="${#fields.hasErrors('clientEmail')}" th:errors="*{clientEmail}">
						</div>
					</div>
					<div class="mb-3">
						<label for="inputPhone" class="form-label fw-bold">Telefone</label>
						<div class="d-flex gap-3">
							<div>
								<input type="text" class="form-control" id="inputPhone" th:field="*{clientPhoneNumber}"
									required disabled>
							</div>
							<div class="d-flex gap-3">
								<a class="btn btn-outline-success" href="#" target="_blank"><i
										class="bi bi-whatsapp"></i></a>
								<a class="btn btn-outline-primary" href="#" target="_blank"><i
										class="bi bi-envelope-fill"></i></a>
							</div>
						</div>
						<div class="text-danger" th:if="${#fields.hasErrors('clientPhoneNumber')}"
							th:errors="*{clientPhoneNumber}">
						</div>

					</div>
					<div class="mb-3">
						<label for="inputStandardOrderInstructions" class="form-label fw-bold">Padrões da
							Empresa</label>
						<textarea maxlength="500" class="form-control" id="inputStandardOrderInstructions" disabled
							th:field="*{standardOrderInstructions}"
							placeholder="Anote aqui as infomações que são padrões em todos os pedidos da empresa, ex: Todas as facas rotativas com margem de 100mm"
							style="height: 80px;"></textarea>
					</div>
					<div class="mb-5">
						<p class="fw-bold">Status da Empresa</p>
						<div class="d-flex gap-5">
							<div class="form-check">
								<input class="form-check-input" th:field="*{active}" value="true" type="radio"
									id="radioDefault1" disabled>
								<label class="form-check-label" for="radioDefault1">
									<span th:text="${client.active} ? 'Ativada' : 'Ativar'"></span>
								</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" th:field="*{active}" value="false" type="radio"
									id="radioDefault2" disabled>
								<label class="form-check-label" for="radioDefault2">
									<span th:text="${client.active} ? 'Desativar' : 'Desativada'"></span>
								</label>
							</div>
						</div>
					</div>

					<button id="btnEditar" type="button" class="btn btn-primary" onclick="toggleEdicao()">Editar
					</button>

					<button id="btnSalvar" type="submit" class="btn btn-warning fw-bold mx-5" disabled>Salvar
						alterações</button>

				</form>
			</div>

			<div class="col-12 col-md-6">

				<div class="accordion accordion-flush border mb-3" id="accordionFlushExample">
					<div class="accordion-item">
						<h2 class="accordion-header">
							<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
								data-bs-target="#flush-collapseOne" aria-expanded="false"
								aria-controls="flush-collapseOne">
								<p class="fw-bold">Informações de Endereço</p>
							</button>
						</h2>
						<div id="flush-collapseOne" class="accordion-collapse collapse"
							data-bs-parent="#accordionFlushExample">
							<div class="accordion-body">
								<p>Rua Antonio Frederico Ozanan, 141, Santa Cruz - Valinhos SP</p>
								<a class="btn btn-outline-warning btn-sm fw-bold">Alterar Dados de Endereço</a>
							</div>
						</div>
					</div>
				</div>

				<div class="mb-5">
					<label for="inputCreatedAt" class="form-label fw-bold">Data do Cadastro</label>
					<input type="text" class="form-control" id="inputCreatedAt"
						th:value="${#temporals.format(client.createdAt,'dd/MM/yyy')}" disabled>
				</div>

				<div class="card mb-5 border-secondary">
					<div class="card-header">
						<span class="fw-bold">Máquinas</span>
					</div>
					<div class="card-body">
						<div>
							<p>Máquinas Cadastradas: <span th:text="${client.qntMachines}"></span></p>
							<div class="d-flex gap-5">
								<a class="btn btn-outline-primary fw-bold"
								   th:href="@{/user/client/{id}/machines(id=${client.id})}">
									Ver Máquinas
								</a>
								<button class="btn btn-success fw-bold"
								        data-bs-toggle="modal"
								        data-bs-target="#newMachineModal">
									Cadastrar Máquina
								</button>
							</div>
						</div>
					</div>
				</div>
				<div class="card mb-5 border-secondary">
					<div class="card-header">
						<span class="fw-bold">Ordens de Serviço</span>
					</div>
					<div class="card-body">
						<div>
							<p>Ordens de Serviço: <span th:text="${client.qntServiceOrder}"></span></p>
							<div class="d-flex gap-5">
								<a class="btn btn-outline-primary fw-bold" href="#">Ver Ordens</a>
								<a class="btn btn-outline-success fw-bold" href="#">Cadastrar Nova OS</a>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>

	</main>
	
	<div class="modal fade" id="newMachineModal" tabindex="-1">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">

				<form th:action="@{/user/client/{id}/machines(id=${client.id})}"
				      method="post">

					<div class="modal-header">
						<h5 class="modal-title">Cadastrar Máquina</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>

					<div class="modal-body">

						<div class="mb-3">
							<label class="form-label">Nome / Modelo</label>
							<input type="text" name="name" class="form-control" required>
						</div>
						<div class="mb-3">
							<label class="form-label">Descrição</label>
							<input type="text" name="description" class="form-control">
						</div>
						
						<div class="mb-3">
							<label class="form-label">Onda</label>
							<input type="text" name="wave" class="form-control" required>
					
						</div>
						

						<div class="mb-3">
							<label class="form-label">Tipo</label>
							<select name="type" class="form-select" id="machineType" required>
								<option value="">Selecione</option>
								<option value="ROTARY">Rotativa</option>
								<option value="FLAT">Plana</option>
							</select>
						</div>

						<!-- ROTARY -->
						<div id="rotaryFields" class="d-none">
							<div class="row">
								<div class="col">
									<input type="number" min="0" name="diameter" class="form-control" placeholder="Diâmetro">
								</div>
								<div class="col">
									<input name="centerLine" class="form-control" placeholder="Linha de centro">
								</div>
							</div>

							<div class="row mt-3">
								<div class="col">
									<input type="number" min="0" name="totalLengthCylinder" class="form-control" placeholder="Comprimento do cilindro">
								</div>
								<div class="col">
									<input type="number" min="0" name="reduction" class="form-control" placeholder="Redução">
								</div>
								<div class="col">
									<input name="drillingInformation" class="form-control" placeholder="Furação">
								</div>
													
							</div>
						</div>

						<!-- FLAT -->
						<div id="flatFields" class="d-none mt-3">
							<div>
								<input name="maxSheetDimension" class="form-control" placeholder="Dimensão máxima da chapa. Ex: 1400 x 1600">
							</div>
							
						</div>
						
						<div class="mt-3">
							<label class="form-label">Observações</label>
							<textarea maxlength="300"  type="text" name="observations" class="form-control" placeholder="Observações sobre essa máquina que podem ser importantes para o desenvolvimento"></textarea>
						</div>

					</div>

					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
						        data-bs-dismiss="modal">Cancelar</button>
						<button type="submit" class="btn btn-success">Salvar</button>
					</div>

				</form>

			</div>
		</div>
	</div>



	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
		crossorigin="anonymous"></script>

	<script>
		let emEdicao = false;

		function toggleEdicao() {
			emEdicao = !emEdicao;

			const inputs = document.querySelectorAll('#clientForm input, #clientForm textarea');

			inputs.forEach(el => {
				el.readOnly = !emEdicao;
				el.disabled = !emEdicao;
			});

			document.getElementById('btnSalvar').disabled = !emEdicao;
			document.getElementById('btnEditar').textContent = emEdicao ? 'Cancelar' : 'Editar';

			if (!emEdicao) {
				location.reload();
			}
		}
	</script>

	
	
	<script>
		const telefone = document.getElementById('inputPhone');

		telefone.addEventListener('input', function (e) {
			let valor = e.target.value.replace(/\D/g, '');

			if (valor.length > 11) valor = valor.slice(0, 11);

			valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');
			valor = valor.replace(/(\d{5})(\d)/, '$1-$2');

			e.target.value = valor;
		});

	</script>

	
	
	<script>
		const cnpj = document.getElementById('inputCnpj');

		cnpj.addEventListener('input', function (e) {
			e.target.value = e.target.value.replace(/\D/g, '');
		});
	</script>
	
	
	
	<script>
		const typeSelect = document.getElementById('machineType');
		const rotary = document.getElementById('rotaryFields');
		const flat = document.getElementById('flatFields');

		typeSelect.addEventListener('change', () => {
			rotary.classList.add('d-none');
			flat.classList.add('d-none');

			if (typeSelect.value === 'ROTARY') {
				rotary.classList.remove('d-none');
			}

			if (typeSelect.value === 'FLAT') {
				flat.classList.remove('d-none');
			}
		});
	</script>



</body>

</html>
