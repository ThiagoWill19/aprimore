<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | User Page</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarSupportedContent">
				<span class="navbar-toggler-icon"></span>
			</button>
		</div>
	</nav>

	<main class="container">
		<nav aria-label="breadcrumb" class="mt-4">
			<ol class="breadcrumb">
				<li class="breadcrumb-item">
					<a th:href="@{/user}">Home</a>
				</li>
				<li class="breadcrumb-item">
					<a th:href="@{/user/client}">Clientes</a>
				</li>
				<li class="breadcrumb-item">
					<a th:href="@{/user/client/{id}(id=${clientId})}">Cliente</a>
				</li>
				<li class="breadcrumb-item">
					<a th:href="@{/user/client/{clientId}/machines(clientId=${clientId})}">Máquinas</a>
				</li>
				<li class="breadcrumb-item active" aria-current="page">
					Máquina
				</li>
			</ol>
		</nav>

		<div th:if="${erro}" class="alert alert-danger">
			<span th:text="${erro}"></span>
		</div>

		<h2 class="mt-3">Dados da Máquina</h2>

		<div class="row">
			<div class="col-12 col-md-8 card p-3 mb-5">
				<form method="post"
					th:action="@{/user/client/{clientId}/machines/machine/{machineId}/update(clientId=${clientId},machineId=${machine.id})}"
					id="machineForm" th:object="${machine}">

					<input type="hidden" th:field="*{id}">
					<input type="hidden" th:field="*{clientId}">
					<input type="hidden" th:field="*{type}">

					<div class="mb-3">
						<label class="form-label fw-bold">Cliente</label>
						<input type="text" class="form-control" th:field="*{clientName}" disabled>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Tipo</label>
						<input type="text" class="form-control"
							th:value="${machine.type == 'ROTARY'} ? 'Rotativa' : 'Plana'" disabled>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Nome</label>
						<input type="text" class="form-control" th:field="*{name}" required disabled>
						<div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Descrição</label>
						<input type="text" class="form-control" th:field="*{description}" disabled>
					</div>

					<div class="mb-3">
							<label class="form-label">Onda</label>
							<input list="waves" type="text" name="wave" class="form-control" th:field="*{wave}" disabled>
							<datalist id="waves">
								<option value="E">
								<option value="B">
								<option value="C">
								<option value="BC">
								<option value="B/C"></option>
							</datalist>
						<div class="text-danger" th:if="${#fields.hasErrors('wave')}" th:errors="*{wave}"></div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Observações</label>
						<textarea maxlength="300" class="form-control" th:field="*{observations}" disabled
							style="height: 80px;"></textarea>
					</div>

					<div th:if="${machine.type == 'ROTARY'}">
						<h5 class="mt-4">Dados Rotativa</h5>
						<div class="row">
							<div class="col-12 col-md-6 mb-3">
								<label class="form-label fw-bold">Diâmetro</label>
								<input type="text" class="form-control" th:field="*{diameter}" disabled>
							</div>
							<div class="col-12 col-md-6 mb-3">
								<label class="form-label fw-bold">Linha de Centro</label>
								<select name="centerLine" class="form-select" th:field="*{centerLine}" disabled>
									<option th:value="*{centerLine}" th:text="*{centerLine}" selected></option>
									<option value="Com Furo">Com furo</option>
									<option value="Furação deslocada">Furação deslocada</option>
								</select>
							</div>
						</div>
						<div class="row">
							<div class="col-12 col-md-4 mb-3">
								<label class="form-label fw-bold">Comprimento do Cilindro</label>
								<input type="text" class="form-control" th:field="*{totalLengthCylinder}" disabled>
							</div>
							<div class="col-12 col-md-4 mb-3">
								<label class="form-label fw-bold">Redução</label>
								<input type="text" class="form-control" th:field="*{reduction}" disabled>
							</div>
						</div>
						<div class="row">
							<div class="col">
									<input type="number" min="0" name="distanceBetweenHolesInStraightLine" class="form-control" placeholder="Distância entre furos retos" th:field="*{distanceBetweenHolesInStraightLine}" disabled>
								</div>
								<div class="col">
									<input type="number" min="0" name="distanceBetweenHolesInCurvedDirection" class="form-control" placeholder="Distância entre furos curvos" th:field="*{distanceBetweenHolesInCurvedDirection}" disabled>
								</div>
								<div class="col">
									<input type="checkbox" name="hasMeshPattern" class="form-check-input" id="hasMeshPattern" disabled th:field="*{hasMeshPattern}">
									<label for="hasMeshPattern" class="form-check-label">Possui malha?</label>
								</div>
						</div>
					</div>

					<div th:if="${machine.type == 'FLAT'}">
						<h5 class="mt-4">Dados Plana</h5>
						<div class="mb-3">
							<label class="form-label fw-bold">Dimensão Máxima da Chapa</label>
							<input type="text" class="form-control" th:field="*{maxSheetDimension}" disabled>
						</div>
					</div>

					<div class="mb-5">
						<p class="fw-bold">Status da Máquina</p>
						<div class="d-flex gap-5">
							<div class="form-check">
								<input class="form-check-input" th:field="*{active}" value="true" type="radio"
									id="radioActive" disabled>
								<label class="form-check-label" for="radioActive">Ativa</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" th:field="*{active}" value="false" type="radio"
									id="radioInactive" disabled>
								<label class="form-check-label" for="radioInactive">Desativada</label>
							</div>
						</div>
					</div>

					<button id="btnEditar" type="button" class="btn btn-primary" onclick="toggleEdicao()">Editar</button>
					<button id="btnSalvar" type="submit" class="btn btn-warning fw-bold mx-5" disabled>Salvar
						alterações</button>
				</form>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
		crossorigin="anonymous"></script>
	<script>
		let emEdicao = false;

		function toggleEdicao() {
			emEdicao = !emEdicao;

			const camposEditaveis = document.querySelectorAll(
				'#machineForm input:not([type="hidden"]):not([name="clientName"]), #machineForm textarea, select'
			);

			camposEditaveis.forEach(el => {
				el.readOnly = !emEdicao;
				el.disabled = !emEdicao;
			});

			document.getElementById('btnSalvar').disabled = !emEdicao;
			document.getElementById('btnEditar').textContent = emEdicao ? 'Cancelar' : 'Editar';

			if (!emEdicao) {
				location.reload();
			}
		}
	</script>
</body>

</html>
