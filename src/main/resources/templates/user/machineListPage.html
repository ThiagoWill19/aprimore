<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | User Page</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">


</head>

<body>
	
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
			        data-bs-target="#navbarSupportedContent">
				<span class="navbar-toggler-icon"></span>
			</button>
		</div>
	</nav>

	<div class="container mt-4">

		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item">
					<a th:href="@{/user}">Home</a>
				</li>
				<li class="breadcrumb-item">
					<a th:href="@{/user/client}">Clientes</a>
				</li>
				<li class="breadcrumb-item">
					<a th:href="@{/user/client/{id}(id = ${clientId})}">Cliente</a>
				</li>
				<li class="breadcrumb-item active">Máquinas</li>
			</ol>
		</nav>

		<h3 class="mt-3">Máquinas do Cliente</h3>

		<table class="table table-hover mt-3">
			<thead>
				<tr>
					<th>Nome</th>
					<th>Tipo</th>
					<th>Tipo de Onda</th>
					<th class="text-end">Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="machine : ${machines.content}">
					<td th:text="${machine.name}"></td>
					<td th:text="${machine.type}"></td>
					<td th:text="${machine.wave}"></td>
					<td class="text-end">
						<a class="btn btn-sm btn-outline-primary disabled">
							Detalhes
						</a>
					</td>
				</tr>
			</tbody>
		</table>

	</div>



	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
		crossorigin="anonymous"></script>


</body>

</html>
