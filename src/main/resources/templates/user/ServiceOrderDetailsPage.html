<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | Ordem de Serviço</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore</a>
		</div>
	</nav>

	<main class="container">
		<nav aria-label="breadcrumb" class="mt-4">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/user}">Home</a></li>
				<li class="breadcrumb-item"><a th:href="@{/user/client}">Clientes</a></li>
				<li class="breadcrumb-item"><a th:href="@{/user/client/{id}(id=${clientId})}">Cliente</a></li>
				<li class="breadcrumb-item"><a th:href="@{/user/client/{id}/service-orders(id=${clientId})}">Ordens de
						Serviço</a></li>
				<li class="breadcrumb-item active" aria-current="page">OS</li>
			</ol>
		</nav>

		<div th:if="${erro}" class="alert alert-danger">
			<span th:text="${erro}"></span>
		</div>

		<div th:if="${success}" class="alert alert-success">
			<span th:text="${success}"></span>
		</div>

		<div class="d-flex gap-5 align-items-center">
			<h2>Ordem de Serviço #<span th:text="${serviceOrder.id}"></span></h2>
			<h2
				th:class="${serviceOrder.status.description == 'ABERTA' ? 'text-success' : serviceOrder.status.description == 'FECHADA' ? 'text-muted' : 'text-danger'}">
				<span th:text="${serviceOrder.status.description}"></span></h2>
		</div>

		<div class="row">
			<div class="col-12 col-md-9 card p-3 mb-5">
				<form method="post" id="serviceOrderForm"
					th:action="@{/user/client/{clientId}/service-orders/{serviceOrderId}/update(clientId=${clientId},serviceOrderId=${serviceOrder.id})}"
					th:object="${serviceOrder}">

					<input type="hidden" th:field="*{id}">
					<input type="hidden" th:field="*{clientId}">

					<div class="mb-3">
						<label class="form-label fw-bold">Nome do Trabalho</label>
						<input type="text" class="form-control os-editable" th:field="*{workName}" required disabled>
						<div class="text-danger" th:if="${#fields.hasErrors('workName')}" th:errors="*{workName}"></div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Referência</label>
						<input type="text" class="form-control os-editable" th:field="*{reference}" disabled>
					</div>

					<div class="row">
						<div class="col-12 col-md-6 mb-3">
							<label class="form-label fw-bold">Data de Entrada</label>
							<input type="date" class="form-control os-editable" th:field="*{entryDate}" disabled>
						</div>
						<div class="col-12 col-md-6 mb-3">
							<label class="form-label fw-bold">Data de Entrega</label>
							<input type="date" class="form-control os-editable" th:field="*{deliveryDate}" disabled>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Máquina</label>
						<select id="machineSelect" class="form-select os-editable" th:field="*{machineId}" required
							disabled>
							<option value="">Selecione uma máquina</option>
							<option th:each="machine : ${machines}" th:value="${machine.id}"
								th:attr="data-waves=${machine.wave}"
								th:text="${machine.name + ' | Onda: ' + machine.wave + (machine.active ? '' : ' (inativa)')}">
							</option>
						</select>
						<div class="text-danger" th:if="${#fields.hasErrors('machineId')}" th:errors="*{machineId}">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Tipo de Onda (OS)</label>
						<select id="typeOfWaveSelect" class="form-select os-editable" th:field="*{typeOfWave}"
							th:attr="data-current=${serviceOrder.typeOfWave}" required disabled>
							<option value="">Selecione o tipo de onda</option>
						</select>
						<div class="text-danger" th:if="${#fields.hasErrors('typeOfWave')}" th:errors="*{typeOfWave}">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Medida Interna</label>
						<input type="text" class="form-control os-editable" th:field="*{internalMeasure}" disabled>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Arranjo</label>
						<input type="text" class="form-control os-editable" th:field="*{arrangement}" disabled>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Serviços a serem executados</label>
						<textarea class="form-control os-editable" th:field="*{servicesToBePerformed}"
							style="height: 100px;" disabled></textarea>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Observações</label>
						<textarea class="form-control os-editable" th:field="*{obs}" style="height: 100px;"
							disabled></textarea>
					</div>

					<div class="mb-4">
						<p class="fw-bold mb-2">Lâminas Para Montagem</p>
						<div class="border rounded p-3">
							<div th:if="${#lists.isEmpty(blades)}" class="text-muted">
								Nao há lâminas cadastradas para sua empresa.
							</div>

							<div th:if="${!#lists.isEmpty(blades)}">
								<div class="mb-3">
									<label for="bladeSearch" class="form-label fw-bold">Buscar lâmina</label>
									<input id="bladeSearch" type="text" class="form-control"
										placeholder="Digite nome, tipo, fabricante ou fornecedor">
								</div>

								<div class="bg-light rounded p-2 mb-3">
									<span class="fw-bold">Selecionadas: </span>
									<span id="selectedBladesCount" class="badge text-bg-primary">0</span>
									<div id="selectedBladesList" class="small mt-2 text-muted">Nenhuma lâmina
										selecionada.</div>
								</div>

								<div class="accordion" id="bladesAccordion">
									<div class="accordion-item">
										<h2 class="accordion-header">
											<button class="accordion-button" type="button" data-bs-toggle="collapse"
												data-bs-target="#cutBlades">
												Corte
											</button>
										</h2>
										<div id="cutBlades" class="accordion-collapse collapse show"
											data-bs-parent="#bladesAccordion">
											<div class="accordion-body" style="max-height: 220px; overflow-y: auto;">
												<div class="form-check mb-2 blade-option" th:each="blade : ${blades}"
													th:with="typeLabel=${blade.bladeType.name() == 'STRAIGHT_CUT' ? 'Corte Reto' : blade.bladeType.name() == 'CURVED_CUT' ? 'Corte Curvo' : blade.bladeType.name()}"
													th:if="${blade.bladeType.name() == 'STRAIGHT_CUT' || blade.bladeType.name() == 'CURVED_CUT'}"
													th:attr="data-search=${#strings.toLowerCase(blade.name + ' ' + typeLabel + ' ' + (blade.manufacturer == null ? '' : blade.manufacturer) + ' ' + (blade.supplier == null ? '' : blade.supplier))}">
													<input class="form-check-input blade-checkbox os-editable"
														type="checkbox" th:field="*{bladeIds}" th:value="${blade.id}"
														th:id="${'blade_' + blade.id}"
														th:attr="data-display=${blade.name},data-manufacturer=${(blade.manufacturer != null && !#strings.isEmpty(blade.manufacturer)) ? blade.manufacturer : 'Nao informado'},data-supplier=${(blade.supplier != null && !#strings.isEmpty(blade.supplier)) ? blade.supplier : 'Nao informado'}"
														disabled>
													<label class="form-check-label" th:for="${'blade_' + blade.id}"
														th:text="${blade.name}"
														th:title="${'Fabricante: ' + ((blade.manufacturer != null && !#strings.isEmpty(blade.manufacturer)) ? blade.manufacturer : 'Nao informado') + ' | Fornecedor: ' + ((blade.supplier != null && !#strings.isEmpty(blade.supplier)) ? blade.supplier : 'Nao informado')}">
													</label>
												</div>
											</div>
										</div>
									</div>

									<div class="accordion-item">
										<h2 class="accordion-header">
											<button class="accordion-button collapsed" type="button"
												data-bs-toggle="collapse" data-bs-target="#creaseBlades">
												Vinco
											</button>
										</h2>
										<div id="creaseBlades" class="accordion-collapse collapse"
											data-bs-parent="#bladesAccordion">
											<div class="accordion-body" style="max-height: 220px; overflow-y: auto;">
												<div class="form-check mb-2 blade-option" th:each="blade : ${blades}"
													th:with="typeLabel=${blade.bladeType.name() == 'STRAIGHT_CREASE' ? 'Vinco Reto' : blade.bladeType.name() == 'CURVED_CREASE' ? 'Vinco Curvo' : blade.bladeType.name()}"
													th:if="${blade.bladeType.name() == 'STRAIGHT_CREASE' || blade.bladeType.name() == 'CURVED_CREASE'}"
													th:attr="data-search=${#strings.toLowerCase(blade.name + ' ' + typeLabel + ' ' + (blade.manufacturer == null ? '' : blade.manufacturer) + ' ' + (blade.supplier == null ? '' : blade.supplier))}">
													<input class="form-check-input blade-checkbox os-editable"
														type="checkbox" th:field="*{bladeIds}" th:value="${blade.id}"
														th:id="${'blade_' + blade.id}"
														th:attr="data-display=${blade.name},data-manufacturer=${(blade.manufacturer != null && !#strings.isEmpty(blade.manufacturer)) ? blade.manufacturer : 'Nao informado'},data-supplier=${(blade.supplier != null && !#strings.isEmpty(blade.supplier)) ? blade.supplier : 'Nao informado'}"
														disabled>
													<label class="form-check-label" th:for="${'blade_' + blade.id}"
														th:text="${blade.name}"
														th:title="${'Fabricante: ' + ((blade.manufacturer != null && !#strings.isEmpty(blade.manufacturer)) ? blade.manufacturer : 'Nao informado') + ' | Fornecedor: ' + ((blade.supplier != null && !#strings.isEmpty(blade.supplier)) ? blade.supplier : 'Nao informado')}">
													</label>
												</div>
											</div>
										</div>
									</div>

									<div class="accordion-item">
										<h2 class="accordion-header">
											<button class="accordion-button collapsed" type="button"
												data-bs-toggle="collapse" data-bs-target="#perforationBlades">
												Picote
											</button>
										</h2>
										<div id="perforationBlades" class="accordion-collapse collapse"
											data-bs-parent="#bladesAccordion">
											<div class="accordion-body" style="max-height: 220px; overflow-y: auto;">
												<div class="form-check mb-2 blade-option" th:each="blade : ${blades}"
													th:with="typeLabel=${blade.bladeType.name() == 'STRAIGHT_PERFORATION' ? 'Picote Reto' : blade.bladeType.name() == 'CUVED_PERFORATION' ? 'Picote Curvo' : blade.bladeType.name()}"
													th:if="${blade.bladeType.name() == 'STRAIGHT_PERFORATION' || blade.bladeType.name() == 'CUVED_PERFORATION'}"
													th:attr="data-search=${#strings.toLowerCase(blade.name + ' ' + typeLabel + ' ' + (blade.manufacturer == null ? '' : blade.manufacturer) + ' ' + (blade.supplier == null ? '' : blade.supplier))}">
													<input class="form-check-input blade-checkbox os-editable"
														type="checkbox" th:field="*{bladeIds}" th:value="${blade.id}"
														th:id="${'blade_' + blade.id}"
														th:attr="data-display=${blade.name},data-manufacturer=${(blade.manufacturer != null && !#strings.isEmpty(blade.manufacturer)) ? blade.manufacturer : 'Nao informado'},data-supplier=${(blade.supplier != null && !#strings.isEmpty(blade.supplier)) ? blade.supplier : 'Nao informado'}"
														disabled>
													<label class="form-check-label" th:for="${'blade_' + blade.id}"
														th:text="${blade.name}"
														th:title="${'Fabricante: ' + ((blade.manufacturer != null && !#strings.isEmpty(blade.manufacturer)) ? blade.manufacturer : 'Nao informado') + ' | Fornecedor: ' + ((blade.supplier != null && !#strings.isEmpty(blade.supplier)) ? blade.supplier : 'Nao informado')}">
													</label>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Status</label>
						<select id="statusSelect" class="form-select os-editable" th:field="*{status}"
							th:attr="data-current=${serviceOrder.status}" required disabled>

							<option th:value="OPEN" th:selected="${serviceOrder.status == 'OPEN'}">ABERTA</option>
							<option th:value="CLOSED" th:selected="${serviceOrder.status == 'CLOSED'}">FECHADA</option>
							<option th:value="CANCELED" th:selected="${serviceOrder.status == 'CANCELLED'}">CANCELADA</option>
						</select>
						<div class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
						</div>
					</div>



					<div class="d-flex gap-3">
						<button id="btnEditar" type="button" class="btn btn-primary"
							onclick="toggleEdicao()">Editar</button>
						<button id="btnSalvar" type="submit" class="btn btn-warning fw-bold" disabled>Salvar
							alteracoes</button>
						<a class="btn btn-outline-secondary"
							th:href="@{/user/client/{id}/service-orders(id=${clientId})}">Voltar</a>
					</div>
				</form>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
		crossorigin="anonymous"></script>
	<script>
		let emEdicao = false;

		function toggleEdicao() {
			emEdicao = !emEdicao;

			const camposEditaveis = document.querySelectorAll('#serviceOrderForm .os-editable');

			camposEditaveis.forEach(el => {
				if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio') {
					el.disabled = !emEdicao;
					return;
				}
				el.readOnly = !emEdicao;
				el.disabled = !emEdicao;
			});

			document.getElementById('btnSalvar').disabled = !emEdicao;
			document.getElementById('btnEditar').textContent = emEdicao ? 'Cancelar' : 'Editar';

			if (!emEdicao) {
				location.reload();
			}
		}
	</script>
	<script>
		function initWaveSelector() {
			const machineSelect = document.getElementById('machineSelect');
			const typeOfWaveSelect = document.getElementById('typeOfWaveSelect');

			if (!machineSelect || !typeOfWaveSelect) {
				return;
			}

			const parseWaves = (raw) => {
				if (!raw || !raw.trim()) {
					return [];
				}
				const unique = new Set();
				raw.toUpperCase().split(/[,;/|\s-]+/).forEach(token => {
					const wave = token.trim();
					if (wave) {
						unique.add(wave);
					}
				});
				return Array.from(unique);
			};

			const rebuildWaveOptions = () => {
				const selectedMachine = machineSelect.options[machineSelect.selectedIndex];
				const rawWaves = selectedMachine ? selectedMachine.dataset.waves : '';
				const machineWaves = parseWaves(rawWaves);
				const currentWave = (typeOfWaveSelect.dataset.current || typeOfWaveSelect.value || '').toUpperCase();

				typeOfWaveSelect.innerHTML = '';

				const placeholder = document.createElement('option');
				placeholder.value = '';
				placeholder.textContent = 'Selecione o tipo de onda';
				typeOfWaveSelect.appendChild(placeholder);

				machineWaves.forEach(wave => {
					const option = document.createElement('option');
					option.value = wave;
					option.textContent = wave;
					if (wave === currentWave) {
						option.selected = true;
					}
					typeOfWaveSelect.appendChild(option);
				});

				typeOfWaveSelect.dataset.current = '';
			};

			machineSelect.addEventListener('change', rebuildWaveOptions);
			rebuildWaveOptions();
		}

		function initBladeUi() {
			const searchInput = document.getElementById('bladeSearch');
			const options = Array.from(document.querySelectorAll('.blade-option'));
			const checkboxes = Array.from(document.querySelectorAll('.blade-checkbox'));
			const selectedCount = document.getElementById('selectedBladesCount');
			const selectedList = document.getElementById('selectedBladesList');

			function updateSelectedPanel() {
				const selected = checkboxes
					.filter(cb => cb.checked)
					.map(cb => ({
						display: cb.dataset.display || '',
						manufacturer: cb.dataset.manufacturer || 'Não informado',
						supplier: cb.dataset.supplier || 'Não informado'
					}));
				selectedCount.textContent = selected.length.toString();

				if (selected.length === 0) {
					selectedList.textContent = 'Nenhuma lâmina selecionada.';
					return;
				}

				selectedList.innerHTML = '';
				selected.forEach(item => {
					const row = document.createElement('div');
					row.textContent = `${item.display}`;
					selectedList.appendChild(row);
				});
			}

			if (searchInput) {
				searchInput.addEventListener('input', () => {
					const term = searchInput.value.trim().toLowerCase();
					options.forEach(option => {
						const haystack = option.dataset.search || '';
						option.style.display = haystack.includes(term) ? '' : 'none';
					});
				});
			}

			checkboxes.forEach(cb => cb.addEventListener('change', updateSelectedPanel));
			updateSelectedPanel();
		}

		document.addEventListener('DOMContentLoaded', () => {
			initWaveSelector();
			initBladeUi();
		});
	</script>
</body>

</html>
