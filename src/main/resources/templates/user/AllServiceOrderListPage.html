<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | Ordens de Servico</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore</a>
		</div>
	</nav>

	<main class="container">
		<nav aria-label="breadcrumb" class="mt-4">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/user}">Home</a></li>
				<li class="breadcrumb-item"><a th:href="@{/user/client}">Clientes</a></li>
				<li class="breadcrumb-item active" aria-current="page">Ordens de Serviço</li>
			</ol>
		</nav>

		<div th:if="${erro}" class="alert alert-danger">
			<span th:text="${erro}"></span>
		</div>

		<div th:if="${success}" class="alert alert-success">
			<span th:text="${success}"></span>
		</div>

		<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
			<h2 class="m-0">Ordens de Serviço</h2>
			<a class="btn btn-success fw-bold" th:href="@{/user/service-orders/new}">Nova OS</a>
		</div>

		<div class="card mb-3">
			<div class="card-body">
				<form class="row g-3 align-items-end" th:action="@{/user/service-orders}" method="get">
					<div class="col-12 col-md-6">
						<label class="form-label mb-1" for="search">Buscar</label>
						<input class="form-control"
							id="search"
							type="search"
							name="search"
							th:value="${search}"
							placeholder="Número da OS ou nome da empresa">
					</div>
					<div class="col-12 col-md-3">
						<label class="form-label mb-1" for="monthYear">Mês/Ano</label>
						<input class="form-control"
							id="monthYear"
							type="month"
							name="monthYear"
							th:value="${monthYear}">
					</div>
					<div class="col-12 col-md-3 d-flex gap-2">
						<button class="btn btn-outline-primary w-100" type="submit">Buscar</button>
						<a class="btn btn-outline-secondary w-100" th:href="@{/user/service-orders}">Limpar</a>
					</div>
				</form>
				<small class="text-muted mt-2 d-block" th:if="${defaultLast30Days}">
					Exibindo OS dos ultimos 30 dias por padrão.
				</small>
			</div>
		</div>

		<div class="card">
			<div class="card-body">
				<div th:if="${serviceOrders.isEmpty()}" class="text-muted">
					Nenhuma ordem de serviço encontrada para os filtros informados.
				</div>

				<div class="table-responsive" th:if="${!serviceOrders.isEmpty()}">
					<table class="table table-striped align-middle">
						<thead>
							<tr>
								<th>ID</th>
								<th>Cliente</th>
								<th>Trabalho</th>
								<th>Referência</th>
								<th>Entrega</th>
								<th>Criada em</th>
								<th>Status</th>
								<th></th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="serviceOrder : ${serviceOrders.content}">
								<td th:text="${serviceOrder.id}"></td>
								<td th:text="${serviceOrder.clientName}"></td>
								<td th:text="${serviceOrder.workName}"></td>
								<td th:text="${serviceOrder.reference}"></td>
								<td
									th:text="${serviceOrder.deliveryDate != null ? #temporals.format(serviceOrder.deliveryDate, 'dd/MM/yyyy') : '-'}">
								</td>
								<td
									th:text="${serviceOrder.createdAt != null ? #temporals.format(serviceOrder.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">
								</td>
								<td th:class="${serviceOrder.status.description == 'ABERTA' ? 'text-success' : serviceOrder.status.description == 'FECHADA' ? 'text-muted' : 'text-danger'}"
									th:text="${serviceOrder.status.description}"></td>
								<td>
									<a class="btn btn-outline-primary btn-sm fw-bold"
										th:href="@{/user/client/{clientId}/service-orders/{serviceOrderId}(clientId=${serviceOrder.clientId},serviceOrderId=${serviceOrder.id})}">
										Ver / Editar
									</a>
								</td>
							</tr>
						</tbody>
					</table>

					<nav class="mt-3">
						<small th:if="${serviceOrders.totalPages > 0}"
							th:text="'Pagina ' + ${serviceOrders.number + 1} + ' de ' + ${serviceOrders.totalPages}">
						</small>

						<ul class="pagination mt-2">
							<li class="page-item" th:classappend="${serviceOrders.first} ? 'disabled'">
								<a class="page-link"
									th:href="@{/user/service-orders(page=${serviceOrders.number - 1}, search=${search}, monthYear=${monthYear})}">
									Anterior
								</a>
							</li>

							<li class="page-item" th:classappend="${serviceOrders.last} ? 'disabled'">
								<a class="page-link"
									th:href="@{/user/service-orders(page=${serviceOrders.number + 1}, search=${search}, monthYear=${monthYear})}">
									Próxima
								</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
		crossorigin="anonymous"></script>
</body>

</html>
