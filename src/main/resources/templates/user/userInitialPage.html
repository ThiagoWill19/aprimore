<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aprimore | User Page</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<link href="/globalStyle.css" rel="stylesheet">
</head>

<body>

	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/user">Aprimore - <span th:text="${businessName}"></spanth></a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="/user">Home</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Configurações</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/user/blades">Lâminas</a>
					</li>
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false">
							Clientes
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="#" data-bs-toggle="modal"
									data-bs-target="#newClientModal">Cadastrar novo cliente</a></li>
							<li><a class="dropdown-item" href="/user/client">Ver clientes</a></li>
						</ul>
					</li>
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false">
							Serviços
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="/user/service-orders/new">Nova Ordem de Servi�o</a></li>
							<li><a class="dropdown-item" href="#">Ver Serviços</a></li>
							<li>
								<hr class="dropdown-divider">
							</li>
							<li><a class="dropdown-item" href="#">Relatório detalhado</a></li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container">
		<p class="mt-2">Olá, <span class="fw-bold" th:text="${username}"></span></p>

		<div th:if="${erro}" class="alert alert-danger">
			<span th:text="${erro}"></span>
		</div>

	</main>


	<!-- Modal de cadastro de cliente -->
	<div class="modal fade" id="newClientModal" tabindex="-1" aria-labelledby="newClientModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="newClientModalLabel">Cadastrar Novo Cliente</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">

					<form method="post" th:action="@{/user/new-client}">
						<div class="d-flex gap-3">
							<div class="bm-3 flex-grow-1">
								<label for="inputClientName" class="form-label">Nome da empresa</label>
								<input type="text" class="form-control" id="inputClientName" th:name="clientName" required>
							</div>
							<div class="bm-3 flex-grow-1">
								<label for="inputCnpj" class="form-label">CNPJ</label>
								<input type="text" class="form-control" id="inputCNPJ" th:name="cnpj"
									placeholder="Somente Números"
								    maxlength="14"
									inputmode="numeric" pattern="[0-9]*" required>
							</div>
						</div>
						<div class="bm-3">
							<label for="inputClientEmail" class="form-label">Email</label>
							<input type="email" class="form-control" id="inputClientEmail" th:name="clientEmail"
								required>
						</div>
						<div class="bm-3">
							<label for="inputPhone" class="form-label">Telefone</label>
							<input type="text" class="form-control" id="inputPhone" th:name="clientPhoneNumber" placeholder="(00) 99999-9999" maxlength="15" required>
						</div>
						
						<div class="mt-3">
							<p class="fw-bold">Endereço</p>
						</div>
						
						<div class="d-flex gap-3">
							<div class="bm-3 flex-grow-1">
								<label for="inputStreet" class="form-label">Rua</label>
								<input type="text" class="form-control" id="inputStreet" th:name="street" required>
							</div>
							<div class="bm-3">
								<label for="inputNumber" class="form-label">Número</label>
								<input type="number" class="form-control" id="inputNumber" th:name="number" min="1" required>
							</div>
						</div>
						<div class="d-flex gap-3">
							<div class="bm-3 flex-grow-1">
								<label for="inputNeighborhood" class="form-label">Bairro</label>
								<input type="text" class="form-control" id="inputNeighborhood" th:name="neighborhood"  required>
							</div>
							<div class="bm-3">
								<label for="inputCity" class="form-label">Cidade</label>
								<input type="text" class="form-control" id="inputCity" th:name="city"  required>
							</div>
						</div>

						<div class="d-flex gap-3">
							<div class="bm-3 flex-grow-1">
								<label for="inputState" class="form-label">Estado</label>
								<input type="text" class="form-control" id="inputState" th:name="state"  required>
							</div>
							<div class="bm-3">
								<label for="inputZipCode" class="form-label">CEP</label>
								<input type="number" class="form-control" id="inputZipCode" th:name="zipCode" required>
							</div>
						</div>
						
						<button type="submit" class="btn btn-success mt-3">Cadastrar</button>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
		
		<script>
		  const telefone = document.getElementById('inputPhone');

		  telefone.addEventListener('input', function (e) {
		    let valor = e.target.value.replace(/\D/g, '');

		    if (valor.length > 11) valor = valor.slice(0, 11);

		    valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');
		    valor = valor.replace(/(\d{5})(\d)/, '$1-$2');

		    e.target.value = valor;
		  });
		  
		</script>
		
		<script>
		  const cnpj = document.getElementById('inputCNPJ');

		  cnpj.addEventListener('input', function (e) {
		    e.target.value = e.target.value.replace(/\D/g, '');
		  });
		</script>

</body>

</html>
